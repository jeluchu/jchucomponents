name: Release

on:
  push:
    tags:
      - "3.*"

permissions:
  contents: write

jobs:
  validate:
    name: Validate release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify tag matches catalog version
        run: |
          catalog_version="$(
            sed -n 's/^jchucomponents = "\(.*\)"/\1/p' \
              gradle/libs.versions.toml
          )"
          test "${GITHUB_REF_NAME}" = "${catalog_version}"

      - name: Release preflight (same script as the "Release preflight" workflow)
        run: scripts/release-preflight.sh "${GITHUB_REF_NAME}"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_args=(--generate-notes)
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            release_args+=(--prerelease)
          fi
          archive="build/swift-release/${GITHUB_REF_NAME}/JchuComponentsCore.xcframework.zip"
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${archive}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${archive}" \
              "${release_args[@]}"
          fi

      - name: Upload SwiftPM repository payload
        uses: actions/upload-artifact@v4
        with:
          name: jchucomponents-spm-${{ github.ref_name }}
          path: |
            build/swift-release/${{ github.ref_name }}/Package.swift
            build/swift-release/${{ github.ref_name }}/Sources
            build/swift-release/${{ github.ref_name }}/Tests
            build/swift-release/${{ github.ref_name }}/Plugins

  publish-swift-package:
    name: Publish SwiftPM manifest repository
    needs: validate
    if: ${{ vars.SPM_REPOSITORY_ENABLED == 'true' }}
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Download SwiftPM payload
        uses: actions/download-artifact@v4
        with:
          name: jchucomponents-spm-${{ github.ref_name }}
          path: swift-package

      - name: Verify downloaded SwiftPM navigation plugin
        run: |
          test -f "swift-package/Plugins/JchuComponentsNavigationGraphPlugin/plugin.swift"

      - name: Check out SwiftPM manifest repository
        uses: actions/checkout@v4
        with:
          repository: Jeluchu/jchucomponents-spm
          token: ${{ secrets.SPM_REPOSITORY_TOKEN }}
          path: jchucomponents-spm

      - name: Publish package sources and tag
        working-directory: jchucomponents-spm
        run: |
          rsync -a --delete --exclude .git ../swift-package/ ./
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${GITHUB_REF_NAME}"
          fi
          if git rev-parse --verify "refs/tags/${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            test "$(
              git rev-list -n 1 "${GITHUB_REF_NAME}"
            )" = "$(git rev-parse HEAD)"
          else
            git tag "${GITHUB_REF_NAME}"
          fi
          git push origin HEAD
          git push origin "refs/tags/${GITHUB_REF_NAME}"

  publish-maven-repository:
    name: Publish KMP artifacts to the Maven repository
    needs: validate
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify repository token
        env:
          MAVEN_REPOSITORY_TOKEN: ${{ secrets.MAVEN_REPOSITORY_TOKEN }}
        run: test -n "${MAVEN_REPOSITORY_TOKEN}"

      - name: Check out the Maven repository
        uses: actions/checkout@v4
        with:
          repository: jeluchu/jchucomponents-maven
          token: ${{ secrets.MAVEN_REPOSITORY_TOKEN }}
          path: jchucomponents-maven

      - name: Publish every module into the repository layout
        run: scripts/publish-maven-repository.sh jchucomponents-maven

      - name: Commit and push
        working-directory: jchucomponents-maven
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "Nothing new to publish for ${GITHUB_REF_NAME}"
          else
            git commit -m "Publish jchucomponents ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi

  # JitPack builds a version the first time somebody requests it. It serves the Android-only modules
  # (ui, core, ktx...), so ask for the new tag now instead of making the first consumer wait.
  # The KMP modules come from jchucomponents-maven, so a JitPack failure never fails the release.
  warm-jitpack:
    name: Ask JitPack to build the tag
    needs: validate
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Request the build and wait for it
        run: |
          base="https://jitpack.io"
          pom="${base}/com/github/jeluchu/jchucomponents/jchucomponents-ui/${GITHUB_REF_NAME}/jchucomponents-ui-${GITHUB_REF_NAME}.pom"
          for attempt in $(seq 1 40); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "${pom}" || true)"
            echo "attempt ${attempt}: HTTP ${code}"
            if [[ "${code}" == "200" ]]; then
              echo "JitPack built ${GITHUB_REF_NAME}"
              exit 0
            fi
            sleep 30
          done
          echo "JitPack did not finish in time; request the version at https://jitpack.io/#jeluchu/jchucomponents"
          exit 1
