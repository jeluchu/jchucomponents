name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - v3

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-style:
    name: Kotlin code style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Report Kotlin formatting improvements
        continue-on-error: true
        run: ./gradlew ktlintCheck

      - name: Upload ktlint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ktlint-reports
          path: "**/build/reports/ktlint/**"
          if-no-files-found: ignore

  catalog-readiness:
    name: Catalog visual readiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check catalog visual scenarios
        run: |
          scripts/check-visual-readiness.sh
          scripts/check-api-readiness.sh

  android:
    name: Android and publications
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test Android
        run: ./gradlew ciCheck

      - name: Compile published KMP consumer for Android
        run: |
          ./gradlew \
            -p smoke-tests/kmp-consumer \
            compileAndroidMain

  apple:
    name: Kotlin Apple and SwiftPM
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test shared code on iOS
        run: |
          ./gradlew \
            :jchucomponents-foundation:iosSimulatorArm64Test \
            :jchucomponents-network:iosSimulatorArm64Test \
            :jchucomponents-pay:iosSimulatorArm64Test \
            :jchucomponents-prefs:iosSimulatorArm64Test \
            :jchucomponents-qr:iosSimulatorArm64Test

      - name: Test shared code on macOS
        run: |
          ./gradlew \
            :jchucomponents-foundation:macosArm64Test \
            :jchucomponents-network:macosArm64Test \
            :jchucomponents-pay:macosArm64Test \
            :jchucomponents-prefs:macosArm64Test \
            :jchucomponents-qr:macosArm64Test

      - name: Publish KMP artifacts for consumer smoke test
        run: |
          ./gradlew \
            :jchucomponents-foundation:publishToMavenLocal \
            :jchucomponents-network:publishToMavenLocal \
            :jchucomponents-pay:publishToMavenLocal \
            :jchucomponents-prefs:publishToMavenLocal \
            :jchucomponents-qr:publishToMavenLocal

      - name: Compile published KMP consumer for iOS
        run: |
          ./gradlew \
            -p smoke-tests/kmp-consumer \
            compileKotlinIosSimulatorArm64

      - name: Compile published KMP consumer for macOS
        run: |
          ./gradlew \
            -p smoke-tests/kmp-consumer \
            compileKotlinMacosArm64

      - name: Assemble XCFramework
        run: |
          ./gradlew \
            :jchucomponents-foundation:assembleJchuComponentsCoreReleaseXCFramework

      - name: Build Swift package
        working-directory: swift
        run: |
          xcodebuild \
            -scheme JchuComponents-Package \
            -destination 'generic/platform=iOS Simulator' \
            build

      - name: Build Swift documentation
        working-directory: swift
        run: |
          xcodebuild \
            -scheme JchuComponents-Package \
            -destination 'generic/platform=iOS Simulator' \
            docbuild

      - name: Build iOS catalog app
        working-directory: samples/iosApp
        run: |
          xcodebuild \
            -project JchuComponentsCatalog.xcodeproj \
            -scheme JchuComponentsCatalog \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
