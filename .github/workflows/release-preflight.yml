name: Release preflight

# Run this BEFORE pushing a release tag: it executes the same script the Release workflow runs
# (scripts/release-preflight.sh), so a failure here costs nothing, while a failure after tagging
# costs a new version and a new tag.
#   gh workflow run "Release preflight"
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to check (defaults to the catalog version)"
        required: false

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run release preflight
        run: scripts/release-preflight.sh "${{ inputs.version }}"
