name: Documentation

on:
  workflow_dispatch:
  push:
    branches:
      - v3
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "README.md"
      - "gradle/libs.versions.toml"
      - "samples/web/**"
      - ".github/workflows/docs.yml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build web catalog and API reference
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate aggregated documentation
        run: ./gradlew :dokkaGenerate

      - name: Build web catalog (Compose for Web / Wasm)
        run: ./gradlew :samples:web:wasmJsBrowserDistribution

      - uses: actions/configure-pages@v5
        id: pages

      - name: Assemble site
        run: |
          # The catalog is the home page; the Dokka API reference lives under /api/.
          mkdir -p _site/api
          cp -R samples/web/build/dist/wasmJs/productionExecutable/. _site/
          cp -R build/dokka/html/. _site/api/
          sed "s|__BASE__|${{ steps.pages.outputs.base_path }}|" samples/web/pages/404.html > _site/404.html
          touch _site/.nojekyll

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
